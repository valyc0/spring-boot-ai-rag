spring.application.name=gemini-rag-demo

# ---- Google GenAI (Gemini) - Spring AI 1.1.8 ----
spring.ai.model.chat=google-genai
spring.ai.model.embedding.text=google-genai

# API key from Google AI Studio (https://aistudio.google.com/apikey)
# The same key is used for chat and embeddings.
# NB: in Spring AI the embedding connection reads its OWN prefix
# (spring.ai.google.genai.embedding.api-key), hence the reference below.
spring.ai.google.genai.api-key=xxxxx


spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}

# Chat model (free tier rate limits apply)
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.chat.options.temperature=0.2

# Embedding model
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# ---- Elasticsearch vector store ----
spring.ai.vectorstore.type=elasticsearch
spring.ai.vectorstore.elasticsearch.index-name=gemini-demo-index
spring.ai.vectorstore.elasticsearch.dimensions=768
spring.ai.vectorstore.elasticsearch.similarity=cosine
spring.elasticsearch.uris=http://localhost:9200